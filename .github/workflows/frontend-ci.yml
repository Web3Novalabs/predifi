name: Frontend CI/CD

on:
  push:
    branches: ["main", "frontend"]
    paths:
      - "frontend/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/src/openapi.rs"
      - "backend/src/openapi_tests.rs"
      - "backend/src/bin/openapi_export.rs"
      - "backend/src/lib.rs"
      - "backend/src/routes/**"
      - "backend/src/db/**"
      - "backend/src/response.rs"
      - "backend/src/tags.rs"
      - "backend/src/price_cache.rs"
      - "backend/src/redis_cache.rs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main", "frontend"]
    paths:
      - "frontend/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/src/openapi.rs"
      - "backend/src/openapi_tests.rs"
      - "backend/src/bin/openapi_export.rs"
      - "backend/src/lib.rs"
      - "backend/src/routes/**"
      - "backend/src/db/**"
      - "backend/src/response.rs"
      - "backend/src/tags.rs"
      - "backend/src/price_cache.rs"
      - "backend/src/redis_cache.rs"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

# Cancel superseded runs on the same branch; different refs run independently.
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  quality:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This job does compile Rust (Issue #2109). `pnpm generate:api` runs
      # `frontend/scripts/generate-api-types.mjs`, which — unless `SPEC` is set
      # — shells out to:
      #
      #   cargo run --manifest-path backend/Cargo.toml --bin predifi-openapi
      #
      # to export the spec straight from `backend/src/openapi.rs`. That is
      # deliberate: generating from the Rust source (not the committed
      # `backend/openapi.json`) is what makes a backend schema change that
      # breaks the pool client fail `pnpm typecheck` here, and it is why this
      # workflow's `paths:` filter includes the backend OpenAPI sources.
      #
      # Removing the toolchain would make the "Generate API types" step fail
      # with `spawnSync cargo ENOENT`. Instead the toolchain stays and the
      # Cargo registry and the `predifi-openapi` build are cached below, so
      # warm runs skip both the crate downloads and most of the compile.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keyed on `backend/Cargo.lock`, mirroring the cache in `backend.yml`.
      # Kept under its own `frontend-` prefix so the frontend job (which only
      # builds the `predifi-openapi` binary in the dev profile) never restores
      # or overwrites the backend job's larger test/clippy target directory.
      - name: Cache Cargo registry and OpenAPI exporter build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: ${{ runner.os }}-frontend-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        run: pnpm generate:api

      - name: Type check generated API types
        run: pnpm typecheck

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Format Check (Lint)
        run: pnpm run lint -- --max-warnings=0

      # Coverage replaces the plain test run rather than sitting alongside it
      # (Issue #1812) — running the suite twice doubles the slowest step in this
      # job for no extra signal. `--coverage` still fails the job on a failing
      # test, so nothing is lost.
      - name: Run Unit & Component Tests with coverage
        run: pnpm run test:coverage

      # Published to the job summary so the figure is visible from the Actions
      # tab without downloading an artifact or scrolling the log. A coverage
      # number nobody sees does not change behaviour, which is the whole point
      # of the issue.
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Frontend test coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node -e '
                const total = require("./coverage/coverage-summary.json").total;
                const row = (name, m) => `| ${name} | ${m.pct}% | ${m.covered}/${m.total} |`;
                console.log("| Metric | Covered | Count |");
                console.log("|---|---|---|");
                console.log(row("Statements", total.statements));
                console.log(row("Branches",   total.branches));
                console.log(row("Functions",  total.functions));
                console.log(row("Lines",      total.lines));
              '
            else
              echo "_No coverage summary produced — the test step likely failed before coverage was written._"
            fi
            echo
            echo "<details><summary>Per-directory breakdown</summary>"
            echo
            echo '```'
            # The per-file table, folded to directories so a gap is locatable
            # without reading 51 rows.
            if [ -f coverage/lcov.info ]; then
              awk -F: '
                /^SF:/  { path = $2; sub(/\/[^\/]*$/, "", path); dir = path }
                /^LF:/  { found[dir] += $2 }
                /^LH:/  { hit[dir]   += $2 }
                END {
                  printf "%-45s %8s %10s\n", "DIRECTORY", "LINES", "COVERED"
                  for (d in found) {
                    pct = found[d] > 0 ? (hit[d] * 100 / found[d]) : 0
                    printf "%-45s %8d %9.1f%%\n", d, found[d], pct
                  }
                }
              ' coverage/lcov.info | sort
            else
              echo "no lcov.info"
            fi
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept even on a failing run: when a test breaks, the HTML report is how
      # you find out what else that file was the only cover for.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Check
        run: pnpm run build

  lighthouse:
    name: Lighthouse CI (Performance Regression)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Lighthouse
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/markets
            http://localhost:3000/leaderboard
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse/budget.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Publish Lighthouse summary
        if: always()
        run: |
          {
            echo "## Lighthouse CI Results"
            echo
            echo "Scanned routes: \`/\`, \`/markets\`, \`/leaderboard\`"
            echo
            echo "See the uploaded Lighthouse report artifact for per-route details."
          } >> "$GITHUB_STEP_SUMMARY"
