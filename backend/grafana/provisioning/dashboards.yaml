apiVersion: 1

providers:
  - name: PrediFi Dashboards
    orgId: 1
    folder: PrediFi
    folderUid: predifi
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
